baseURL = "https://sudheer.github.io/"
title = "SuDo"
languageCode = "en-us"
publishDir = "public"          # build output goes to /docs for GitHub Pages

theme = "github.com/sudheer/marcus-hugo"

[pagination]
  pagerSize = 10               # replaces deprecated `paginate = 10`

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    style = 'github'
    lineNos = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6

[params]
  author = 'SuDo'
  description = 'A minimal personal blog'

# Navigation menu
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    name = "Micro"
    url = "/micro/"
    weight = 30

[module]
  [[module.imports]]
    path = "github.com/sudheer/marcus-hugo"
