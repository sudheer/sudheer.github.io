name: CI

on:
  pull_request:
  push:
    branches: [main, master, dev, work]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type/content check
        run: npm run check -w apps/blog

      - name: Build site
        run: npm run build -w apps/blog
