name: Astro PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_BRANCH: gh-pages

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      astro_ready: ${{ steps.detect.outputs.astro_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Astro project files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]] && ls astro.config.* >/dev/null 2>&1; then
            echo "astro_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "astro_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment skip reason on PR (migration in progress)
        if: steps.detect.outputs.astro_ready != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const body = [
              'ℹ️ Astro preview skipped for this PR.',
              '',
              'Reason: this branch does not yet contain a complete Astro project (`package.json` + `astro.config.*`).',
              'Once Astro migration files are present, this workflow will build and deploy preview automatically.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

  preview:
    needs: precheck
    if: needs.precheck.outputs.astro_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gh-pages branch exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            echo "Branch $PAGES_BRANCH exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$PAGES_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          printf '<!doctype html><title>Bootstrap</title><p>Preview bootstrap.</p>' > index.html
          touch .nojekyll
          git add index.html .nojekyll
          git commit -m "Bootstrap gh-pages for previews"
          git push origin "$PAGES_BRANCH"

      - name: Setup Astro
        uses: withastro/action@v3
        with:
          path: .
          node-version: 20
          package-manager: npm

      - name: Build Astro site for PR preview
        run: npm run build -- --base "/preview/pr-${{ github.event.pull_request.number }}/"

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Deploy preview to gh-pages/preview/pr-<PR>
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.PAGES_BRANCH }}
          folder: dist
          target-folder: preview/pr-${{ github.event.pull_request.number }}
          clean: true

      - name: Verify preview URL is reachable
        id: verify_preview
        continue-on-error: true
        shell: bash
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/
        run: |
          set -euo pipefail
          echo "Checking $PREVIEW_URL"
          for i in $(seq 1 40); do
            code=$(curl -s -L -o /dev/null -w "%{http_code}" "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Preview is live"
              exit 0
            fi
            echo "Attempt $i/40: HTTP $code, retrying in 15s..."
            sleep 15
          done
          echo "Preview did not become reachable in time"
          exit 1

      - name: Comment preview URL on PR
        if: steps.verify_preview.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${pr}/`;
            const body = [
              '✅ Preview deployed for this PR.',
              '',
              `**Preview URL:** ${url}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

      - name: Comment delayed-propagation help on PR
        if: steps.verify_preview.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${pr}/`;
            const body = [
              '⚠️ Preview was deployed, but the URL was not reachable within the workflow wait window.',
              '',
              `**Preview URL (may become available shortly):** ${url}`,
              '',
              'If it still does not load after a few minutes, re-run the `Astro PR Preview` workflow.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });
