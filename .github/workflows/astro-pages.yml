name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PAGES_BRANCH: gh-pages

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      astro_ready: ${{ steps.detect.outputs.astro_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Astro project files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]] && ls astro.config.* >/dev/null 2>&1; then
            echo "astro_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "astro_ready=false" >> "$GITHUB_OUTPUT"
            echo "Astro not ready on this branch yet; skipping deploy."
          fi

  deploy:
    needs: precheck
    if: needs.precheck.outputs.astro_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Astro
        uses: withastro/action@v3
        with:
          path: .
          node-version: 20
          package-manager: npm

      - name: Build production site
        run: npm run build

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Deploy production to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.PAGES_BRANCH }}
          folder: dist
          clean: true
          clean-exclude: preview
